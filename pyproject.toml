[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepaccel"
version = "0.1.0"
description = "Accelerometer-only 4-class sleep staging (Wake/Light/Deep/REM) from wrist-worn accelerometer data."
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
